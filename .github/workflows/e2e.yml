# The Playwright suites, run against a DEPLOYED instance.
#
# These are separate from `ci.yml` because they need something CI cannot give
# them: a reachable deployment. The UGM box sits on a private network, so a
# GitHub-hosted runner cannot see it — this workflow only does anything useful
# on a self-hosted runner with that access, or when pointed at a public URL.
#
# Manual by default. Set the repository variable E2E_RUNNER to the label of a
# runner that can reach BASE_URL, and the secret E2E_APP_PASSWORD to that
# deployment's APP_PASSWORD, then the nightly schedule will pick it up.
name: E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployment to test
        required: false
        default: http://10.17.254.27:3000
  schedule:
    # 02:00 UTC = 09:00 WIB, after the box has been idle overnight.
    - cron: "0 2 * * *"

concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  browser:
    name: Browser and API suites
    # Falls back to ubuntu-latest so the workflow is always valid; on a hosted
    # runner it will fail fast at the reachability check below rather than
    # producing 90 confusing timeouts.
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'http://10.17.254.27:3000' }}
      APP_PASSWORD: ${{ secrets.E2E_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the deployment is reachable
        run: |
          if ! curl -fsS -m 15 -o /dev/null "$BASE_URL/login"; then
            echo "::error::$BASE_URL is not reachable from this runner."
            echo "The suites drive a live deployment; a runner without network"
            echo "access to it cannot run them. Set the E2E_RUNNER repository"
            echo "variable to a self-hosted runner that can reach the box."
            exit 1
          fi

      - name: Check the password is set
        run: |
          if [ -z "$APP_PASSWORD" ]; then
            echo "::error::E2E_APP_PASSWORD is not set."
            echo "Every suite signs in first; without it they all fail at login."
            exit 1
          fi

      - run: npx playwright install --with-deps chromium

      - name: Run the suites
        run: npx playwright test

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
